<!DOCTYPE html>
<html lang="pt-BR" data-perfil="gestor">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VISAT Manager</title>
<link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css">
<style>
:root{
  --bg:#f2f4f8;--surf:#fff;--txt:#17202e;--mut:#4a5568;--bd:#d3d9e4;
  --brand:#14305a;--brand-2:#1f4a8a;--brand-soft:#e6ecf7;
  --danger:#b91c1c;--warn:#92400e;--ok:#166534;
  --raio:10px;--sombra:0 1px 2px rgba(20,30,50,.08),0 2px 8px rgba(20,30,50,.06);
}
html[data-perfil="inspetor"]{--brand:#0b5559;--brand-2:#0e7378;--brand-soft:#dff0f0}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
[hidden]{display:none!important}
h1,h2,h3{line-height:1.25;margin:0}
h1{font-size:1.5rem}h2{font-size:1.1rem}h3{font-size:1rem}
a{color:var(--brand-2)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #f59e0b;outline-offset:2px;border-radius:4px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;background:#fff;padding:8px 12px;z-index:100;border-radius:6px}
.skip:focus{top:8px}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:.85em}
.ico{width:1.15em;height:1.15em;flex:none;vertical-align:-.2em}

/* ---------- layout ---------- */
.app{display:flex;min-height:100vh}
.side{width:256px;flex:none;background:var(--brand);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:40}
.side a{color:#fff}
.side-topo{padding:18px 18px 8px;font-weight:700;font-size:1.1rem}
.logo{display:flex;align-items:center;gap:8px}
.perfil-card{margin:8px 14px 14px;padding:12px;background:rgba(255,255,255,.12);border-radius:var(--raio);display:flex;flex-direction:column;gap:2px;font-size:.85rem}
.perfil-card strong{font-size:1rem}
.selo{align-self:flex-start;background:#fff;color:var(--brand);font-weight:800;font-size:.7rem;letter-spacing:.08em;padding:2px 8px;border-radius:99px;margin-bottom:4px}
.side nav ul{list-style:none;margin:0;padding:0 10px}
.side nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;text-decoration:none;margin-bottom:2px}
.side nav a:hover{background:rgba(255,255,255,.14)}
.side nav a.ativo{background:#fff;color:var(--brand);font-weight:700}
.side-rodape{margin-top:auto;padding:14px;font-size:.8rem}
.side-rodape .btn{width:100%;background:transparent;color:#fff;border-color:rgba(255,255,255,.55)}
.side-rodape p{margin:8px 0 0;opacity:.9}
.corpo{flex:1;min-width:0;display:flex;flex-direction:column}
.topo{background:var(--surf);border-top:4px solid var(--brand);border-bottom:1px solid var(--bd);padding:8px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:30}
.topo .esp{flex:1}
.topo .quem{display:flex;flex-direction:column;line-height:1.2;font-size:.85rem}
.topo .quem span{color:var(--mut)}
.topo .selo{background:var(--brand);color:#fff;margin:0}
.trocar{display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--mut)}
.trocar select{padding:5px 8px;font-size:.85rem}
.btn.menu-btn{display:none}
.overlay{display:none}
main{padding:20px;max-width:1240px;width:100%;margin:0 auto;outline:0}
main h1:focus{outline:0}
.pagina-topo{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.pagina-topo .acoes{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sub-titulo{color:var(--mut);margin:2px 0 0}

/* ---------- componentes ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border:1px solid var(--bd);border-radius:8px;background:#fff;cursor:pointer;font-weight:600;text-decoration:none;color:var(--txt);min-height:40px}
.btn:hover{background:#f3f5f9}
.btn.primario{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primario:hover{background:var(--brand-2)}
.btn.perigo{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.peq{padding:4px 10px;min-height:32px;font-size:.85rem}
.btn[disabled],.btn[aria-disabled="true"]{background:#eceff4;color:#5b6473;border-color:#cfd6e2;cursor:not-allowed}
.btn[aria-disabled="true"] .ico{opacity:.8}
.card{background:var(--surf);border:1px solid var(--bd);border-radius:var(--raio);box-shadow:var(--sombra);padding:16px}
.card>h2{margin-bottom:10px;display:flex;align-items:center;gap:8px}
.grade{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr))}
.g-det{grid-template-columns:minmax(0,2fr) minmax(0,1fr);align-items:start}
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--brand-soft);border:1px solid var(--brand);border-left-width:6px;border-radius:var(--raio);padding:10px 14px;margin-bottom:16px;color:#10203a;font-size:.9rem}
html[data-perfil="inspetor"] .banner{color:#06302f}
.banner .ico{color:var(--brand);margin-top:2px}
.selo-pill{display:inline-flex;align-items:center;gap:6px;background:var(--brand);color:#fff;border-radius:99px;padding:3px 12px;font-size:.8rem;font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surf);border:1px solid var(--bd);border-radius:var(--raio);box-shadow:var(--sombra);padding:14px;display:flex;flex-direction:column;gap:2px;border-top:4px solid var(--brand)}
.kpi:hover{background:var(--brand-soft)}
.kpi:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}
.kpi .n{font-size:1.9rem;font-weight:800;line-height:1.1}
.kpi .r{color:var(--mut);font-size:.85rem;display:flex;gap:6px;align-items:center}
.kpi.alerta{border-top-color:var(--danger)}.kpi.alerta .n{color:var(--danger)}
.kpi.aviso{border-top-color:#b26a00}.kpi.aviso .n{color:var(--warn)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:.78rem;font-weight:600;white-space:nowrap;border:1px solid transparent}
.st-nova{background:#e5ecfc;color:#1e3a8a;border-color:#b6c6f0}
.st-analise{background:#eee6fb;color:#4c1d95;border-color:#cdb8f1}
.st-andamento{background:#dff1fc;color:#075985;border-color:#a9d6f2}
.st-aguardando{background:#fdf0c4;color:#713f12;border-color:#ecd07a}
.st-concluida{background:#d9f3e0;color:#14532d;border-color:#9dd7ae}
.pr-alta{background:#fde2e2;color:#7f1d1d;border-color:#f2b0b0}
.pr-media{background:#ffe9d3;color:#7c2d12;border-color:#f2c39a}
.pr-baixa{background:#e4e8ef;color:#1e293b;border-color:#c3cad6}
.or-sei{background:#fff;color:#334155;border-color:#94a3b8;font-weight:700}
.or-man{background:#fff;color:#334155;border-color:#94a3b8;border-style:dashed}
.sem-resp{background:#fde2e2;color:#7f1d1d;border-color:#f2b0b0}
.aprov{background:#f5e6ff;color:#581c87;border-color:#d8b4fe}
.prazo{display:inline-flex;align-items:center;gap:4px;font-size:.8rem;font-weight:700}
.prazo.venc{color:var(--danger)}.prazo.breve{color:var(--warn)}.prazo.ok{color:var(--ok)}.prazo.neutro{color:var(--mut)}
.campo{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.campo label,.campo .rot{font-weight:600;font-size:.88rem}
.campo input,.campo select,.campo textarea{padding:8px 10px;border:1px solid #8b95a7;border-radius:8px;background:#fff;min-height:40px;width:100%}
.campo textarea{min-height:90px;resize:vertical}
.campo input[disabled],.campo select[disabled],.campo textarea[disabled]{background:#eceff4;color:#4a5568;border-color:#c3cad6}
.campo [aria-invalid="true"]{border-color:var(--danger);border-width:2px}
.dica{color:var(--mut);font-size:.8rem;display:flex;gap:4px;align-items:center}
.dica.trava{color:#5b3b00;font-weight:600}
.erro{color:var(--danger);font-size:.83rem;font-weight:600;margin:0;display:flex;gap:4px;align-items:center}
.bloq{display:block}.bloq select,.bloq input,.bloq textarea{pointer-events:none}
.alerta-form{background:#fde8e8;border:1px solid #f2b0b0;color:#7f1d1d;padding:10px 14px;border-radius:8px;margin-bottom:12px;font-weight:600}
.filtros{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end;margin-bottom:8px}
.filtros .campo{margin:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--brand-soft);border:1px solid var(--brand);color:#10203a;border-radius:99px;padding:2px 4px 2px 10px;font-size:.82rem;font-weight:600}
.chip button{all:unset;cursor:pointer;display:inline-flex;padding:3px;border-radius:99px}
.chip button:hover{background:rgba(0,0,0,.12)}
.chip button:focus-visible{outline:3px solid #f59e0b}
.resultado-topo{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0;min-height:32px}
.contador{margin:0;font-weight:600}
.barra-lote{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--brand-soft);border:1px solid var(--brand);padding:8px 12px;border-radius:8px;margin-bottom:8px}
.tabela-wrap{background:var(--surf);border:1px solid var(--bd);border-radius:var(--raio);box-shadow:var(--sombra);overflow-x:auto}
table.tabela{width:100%;border-collapse:collapse}
.tabela th,.tabela td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--bd);vertical-align:top}
.tabela thead th{background:#eef1f6;font-size:.82rem;white-space:nowrap}
.tabela th button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px;font-weight:700}
.tabela th button:focus-visible{outline:3px solid #f59e0b}
.tabela th[aria-sort="ascending"] button::after{content:"▲";font-size:.7em}
.tabela th[aria-sort="descending"] button::after{content:"▼";font-size:.7em}
.tabela tbody tr{cursor:pointer}
.tabela tbody tr:hover{background:#f6f8fc}
.tabela tbody tr:focus-visible{outline:3px solid #f59e0b;outline-offset:-3px}
.tabela tbody tr.sel{background:var(--brand-soft)}
.tabela .tit{font-weight:700;text-decoration:none;color:var(--txt)}
.tabela .tit:hover{text-decoration:underline}
.sub{color:var(--mut);font-size:.82rem;margin-top:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pagin{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.vazio{text-align:center;padding:36px 16px;color:var(--mut)}
.vazio .ico{width:2.6em;height:2.6em;color:var(--brand);margin-bottom:6px}
.vazio h2{color:var(--txt);margin-bottom:4px}
.vazio .btn{margin-top:12px}
ul.itens{list-style:none;margin:0;padding:0}
.item{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--bd)}
.item:last-child{border-bottom:0}
.item .tx{min-width:0;flex:1 1 220px}
.item .tx a{font-weight:700;color:var(--txt)}
.item .ac{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.item .ac select{padding:4px 8px;border:1px solid #8b95a7;border-radius:8px;min-height:32px}
blockquote{margin:4px 0 0;padding:4px 10px;border-left:3px solid var(--bd);color:var(--mut);font-size:.85rem}
.meter{height:10px;background:#e4e8ef;border-radius:99px;overflow:hidden}
.meter span{display:block;height:100%;background:var(--brand)}
.carga{padding:8px 0;border-bottom:1px solid var(--bd)}
.carga:last-child{border-bottom:0}
.carga .lin{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.9rem;margin-bottom:4px}
.sync{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--mut);font-size:.88rem}
.spin{width:16px;height:16px;border:3px solid #c3cad6;border-top-color:var(--brand);border-radius:50%;animation:gira .8s linear infinite;display:inline-block}
@keyframes gira{to{transform:rotate(360deg)}}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:12px 0}
.meta dt{font-size:.78rem;color:var(--mut);font-weight:600}
.meta dd{margin:0;font-weight:600}
.descr{white-space:pre-wrap;margin:0}
.timeline{list-style:none;margin:0;padding:0;position:relative}
.ev{display:flex;gap:10px;padding:8px 0;position:relative}
.ev::before{content:"";position:absolute;left:15px;top:36px;bottom:-8px;width:2px;background:var(--bd)}
.ev:last-child::before{display:none}
.ev-ico{width:32px;height:32px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:var(--brand-soft);color:var(--brand);border:1px solid var(--brand)}
.ev-t{margin:0;word-break:break-word}
.ev-m{margin:0;color:var(--mut);font-size:.8rem}
.docs li{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--bd)}
.docs .nm{display:flex;gap:8px;align-items:center;min-width:0;word-break:break-all}
.aviso-box{background:#f5e6ff;border:1px solid #d8b4fe;color:#3b0764;border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:.9rem}
.seg{display:inline-flex;border:1px solid var(--brand);border-radius:8px;overflow:hidden}
.seg label{padding:6px 14px;cursor:pointer;font-weight:600;background:#fff}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:checked+span{background:var(--brand);color:#fff}
.seg span{display:block;padding:6px 14px;margin:-6px -14px}
.seg label:has(input:focus-visible){outline:3px solid #f59e0b;outline-offset:-3px}
.graf{width:100%;max-width:420px;display:block}
.graf .g-rot{font-size:11px;fill:var(--txt)}
.graf .g-val{font-size:11px;font-weight:700;fill:var(--txt)}
.graf .g-fundo{fill:#e8ecf3}
.graf .g-centro{font-size:7px;font-weight:800;fill:var(--txt);text-anchor:middle}
.graf .g-cent2{font-size:2.6px;fill:var(--mut);text-anchor:middle}
.graf [tabindex]:hover{opacity:.85}
.rosca-wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.rosca-wrap .graf{max-width:190px}
.legenda{list-style:none;margin:0;padding:0;font-size:.88rem;flex:1 1 180px}
.legenda li{display:flex;align-items:center;gap:8px;padding:3px 0}
.legenda i{width:14px;height:14px;border-radius:3px;flex:none;border:2px solid #fff;box-shadow:0 0 0 1px #6b7280}
#tooltip{position:fixed;z-index:200;background:#111827;color:#fff;padding:6px 10px;border-radius:6px;font-size:.8rem;max-width:280px;pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.3)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:150;width:max-content;max-width:calc(100vw - 24px)}
.toast{background:#111827;color:#fff;padding:10px 16px;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.toast a{color:#93c5fd;margin-left:8px;font-weight:700}
.modal-fundo{position:fixed;inset:0;background:rgba(10,18,32,.55);z-index:120;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:12px;max-width:520px;width:100%;max-height:calc(100vh - 32px);overflow:auto;padding:20px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.modal.larga{max-width:820px}
.modal h2{margin-bottom:10px}
.modal-acoes{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;flex-wrap:wrap}
.modal-erro{color:var(--danger);font-weight:600;margin-top:8px}
.previa{border:1px solid var(--bd);background:#f7f8fb;padding:18px;border-radius:8px}
.previa .l{height:9px;background:#d5dbe6;border-radius:4px;margin:9px 0}
.mapa svg{width:100%;height:auto;display:block}
.mapa .no rect{fill:#fff;stroke:var(--brand);stroke-width:1.5}
.mapa .no text{font-size:12px;fill:#17202e}
.mapa .no .t2{font-size:10px;fill:#4a5568}
.mapa .no.atual rect{fill:var(--brand);stroke-width:3}
.mapa .no.atual text{fill:#fff}
.mapa .no.bloq rect{stroke:#6b7280;stroke-dasharray:5 3;fill:#eceff4}
.mapa .seta{stroke:#4a5568;stroke-width:1.5;fill:none;marker-end:url(#seta)}
.mapa .rot{font-size:10px;fill:#4a5568}
.mapa a:focus-visible rect{stroke:#f59e0b;stroke-width:4}
.legenda-mapa{display:flex;gap:16px;flex-wrap:wrap;font-size:.85rem;margin-top:8px}
.legenda-mapa span{display:inline-flex;gap:6px;align-items:center}
.legenda-mapa i{display:inline-block;width:18px;height:12px;border:2px solid var(--brand);border-radius:3px}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.login-marca{background:linear-gradient(160deg,#14305a,#0b5559);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:center;gap:14px}
.login-marca h1{font-size:2.2rem}
.login-marca ul{padding-left:18px;margin:0}
.login-form{display:flex;align-items:center;justify-content:center;padding:24px}
.login-form form{width:100%;max-width:400px}
.senha-wrap{position:relative}
.senha-wrap input{padding-right:46px}
.senha-wrap button{position:absolute;right:2px;top:2px;bottom:2px;width:42px;background:transparent;border:0;cursor:pointer;border-radius:6px}

/* ---------- responsivo ---------- */
@media (max-width:1000px){.g-det{grid-template-columns:1fr}}
@media (max-width:860px){
  .btn.menu-btn{display:inline-flex}
  .side{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);visibility:hidden;transition:transform .2s,visibility 0s .2s}
  .menu-aberto .side{transform:none;visibility:visible;transition-delay:0s}
  .menu-aberto .overlay{display:block;position:fixed;inset:0;background:rgba(10,18,32,.5);z-index:35}
  .login{grid-template-columns:1fr}.login-marca{padding:28px}
  .topo .quem{display:none}
  main{padding:14px}
}
@media (max-width:720px){
  table.tabela thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  table.tabela,.tabela tbody,.tabela tr,.tabela td{display:block;width:100%}
  .tabela tr{border-bottom:1px solid var(--bd);padding:10px 12px}
  .tabela td{border:0;padding:3px 0;display:flex;gap:8px;align-items:baseline}
  .tabela td[data-label]::before{content:attr(data-label);font-size:.75rem;color:var(--mut);font-weight:700;min-width:84px;flex:none}
  .tabela td.c-check::before{content:"Selecionar"}
  .tabela td>div{flex:1;min-width:0}
  .tabela-wrap{border:0;box-shadow:none;background:transparent}
  .tabela tbody tr{background:#fff;border:1px solid var(--bd);border-radius:var(--raio);margin-bottom:10px;box-shadow:var(--sombra)}
  .topo{padding:8px 12px}
  .trocar span{display:none}
  .trocar{flex:1 1 140px}.trocar select{width:100%;min-width:0}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important;scroll-behavior:auto!important}
  .spin{border-top-color:var(--brand);border-right-color:var(--brand)}
}

/* ---------- Mapa de demandas (MVP) ---------- */
.g-mapa{grid-template-columns:minmax(0,2.2fr) minmax(260px,1fr);align-items:start}
#mapa{height:560px;border-radius:8px;border:1px solid var(--bd);background:#e9eef5;z-index:0}
.mapa-legenda{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--mut);margin-top:10px}
.mapa-legenda i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.pino{display:grid;place-items:center;border-radius:50%;color:#fff;font-weight:800;font-size:.8rem;border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.4)}
.locais{max-height:560px;overflow-y:auto}
.locais .item{cursor:pointer}
.locais .item:hover{background:var(--brand-soft)}
.pop h3{font-size:.95rem;margin:0 0 6px}.pop ul{margin:0;padding-left:16px;max-height:220px;overflow-y:auto}.pop li{margin:4px 0}

/* =====================================================================

/* =====================================================================
   2. UTILITÁRIOS (datas, texto, formatação)

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const ESC_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ESC_MAP[c]);
const escBr = v => esc(v).replace(/\n/g, '<br>');
const pad = (n, t = 2) => String(n).padStart(t, '0');

function parseISO(s) { const [y, m, d] = s.slice(0, 10).split('-').map(Number); return new Date(y, m - 1, d); }
function iso(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function isoDT(d) { return `${iso(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function addDias(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
function diasEntre(a, b) { return Math.round((Date.UTC(b.getFullYear(), b.getMonth(), b.getDate()) - Date.UTC(a.getFullYear(), a.getMonth(), a.getDate())) / 864e5); }

const HOJE = HOJE_FIXA ? parseISO(HOJE_FIXA) : (() => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); })();
const HOJE_ISO = iso(HOJE);
function agora() {
  const n = new Date();
  if (HOJE_FIXA) n.setFullYear(HOJE.getFullYear(), HOJE.getMonth(), HOJE.getDate());
  return isoDT(n);
}
const diasAte = prazo => diasEntre(HOJE, parseISO(prazo));

const fData = new Intl.DateTimeFormat('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
const fDataHora = new Intl.DateTimeFormat('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
const fHora = new Intl.DateTimeFormat('pt-BR', { hour: '2-digit', minute: '2-digit' });
const fNum = new Intl.NumberFormat('pt-BR');
const fDec = new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const fPct = new Intl.NumberFormat('pt-BR', { style: 'percent', maximumFractionDigits: 0 });
const fmtData = s => s ? fData.format(parseISO(s)) : '—';
const fmtDataHora = s => s ? fDataHora.format(new Date(s)).replace(',', '') : '—';
const fmtHora = s => s ? fHora.format(new Date(s)) : '—';
const fmtTam = b => b < 1024 * 1024 ? `${fNum.format(Math.max(1, Math.round(b / 1024)))} KB` : `${fDec.format(b / 1048576)} MB`;
const plural = (n, s, p) => `${fNum.format(n)} ${n === 1 ? s : p}`;
const enc = id => encodeURIComponent(id);
const isAberta = d => d.status !== 'Concluída';

   3. ESTADO, PERSISTÊNCIA E DADOS DE EXEMPLO

const memoria = {};

const store = {
  ler() { try { return localStorage.getItem(CHAVE); } catch (e) { storageOk = false; return memoria[CHAVE] ?? null; } },
  gravar(v) { try { localStorage.setItem(CHAVE, v); } catch (e) { storageOk = false; memoria[CHAVE] = v; } }
};

const filtrosPadrao = () => ({ q: '', status: '', prioridade: '', resp: '', prazo: '', origem: '', ord: { col: 'prazo', dir: 'asc' }, pag: 1 });

const nomeDe = id => id === 'sei' ? 'Sincronização SEI' : (USUARIOS.find(u => u.id === id)?.nome ?? '—');

/* As demandas agora vivem no servidor (API + banco de dados).
   No navegador ficam só a sessão e as preferências de tela (filtros, período). */
function carregar() {
  const base = { v: 2, demandas: [], token: null, sessao: null, ultimoLogin: 'g1', filtros: filtrosPadrao(), mapaFiltros: mapaFiltrosPadrao(), relPeriodo: 30, ultimaSync: null };
  try {
    const e = JSON.parse(store.ler() || 'null');
    if (e && e.v === 2) return { ...base, ...e, demandas: [], filtros: { ...filtrosPadrao(), ...e.filtros }, mapaFiltros: { ...mapaFiltrosPadrao(), ...e.mapaFiltros } };
  } catch (err) { /* preferências corrompidas: recomeça */ }
  return base;
}
let estado = carregar();
const salvar = () => store.gravar(JSON.stringify({ v: 2, token: estado.token, sessao: estado.sessao, ultimoLogin: estado.ultimoLogin, filtros: estado.filtros, mapaFiltros: estado.mapaFiltros, relPeriodo: estado.relPeriodo }));
const selecionadas = new Set();      // seleção em lote (não persiste)
let sincronizando = false;

/* ---------- Cliente da API ---------- */
async function api(metodo, caminho, corpo, { arquivo = false } = {}) {
  const opts = { method: metodo, headers: {} };
  if (estado.token) opts.headers.Authorization = 'Bearer ' + estado.token;
  if (corpo instanceof FormData) opts.body = corpo;
  else if (corpo !== undefined) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(corpo); }
  let r;
  try { r = await fetch(caminho, opts); } catch (e) { throw new Error('Sem conexão com o servidor do VISAT Manager.'); }
  if (r.status === 401 && caminho !== '/api/login') {
    estado.token = null; estado.sessao = null; estado.demandas = []; salvar();
    if (parseHash().tela !== 'login') location.hash = '#/login';
    throw new Error('Sessão expirada. Entre novamente.');
  }
  if (!r.ok) {
    let msg = `Erro ${r.status}`;
    try { const j = await r.json(); msg = Array.isArray(j.detail) ? j.detail.map(x => x.msg).join(' ') : (j.detail || msg); } catch (e) { /* sem corpo */ }
    throw new Error(msg);
  }
  if (arquivo) return r.blob();
  return r.status === 204 ? null : r.json();
}
const urlDemanda = (id, resto = '') => `/api/demandas/${encodeURIComponent(id)}${resto}`;

async function recarregar() {
  const e = await api('GET', '/api/estado');
  definirUsuarios(e.usuarios);
  estado.demandas = e.demandas; estado.ultimaSync = e.ultimaSync;
  MUNICIPIOS = e.municipios || MUNICIPIOS; BAIRROS = e.bairros || BAIRROS;
}

/* Executa uma ação no servidor, recarrega os dados e redesenha a tela. Erros viram toast. */
async function executar(fn) {
  try { const r = await fn(); await recarregar(); salvar(); renderAtual(); return r ?? true; }
  catch (e) { toast(e.message); return null; }
}

async function baixarArquivo(caminho, nome) {
  try {
    const blob = await api('GET', caminho, undefined, { arquivo: true });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nome;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    return true;
  } catch (e) { toast(e.message); return false; }
}

/* =====================================================================
   4. PERMISSÕES (funções que consultam PERMS)

const demandasVisiveis = () => estado.demandas.filter(podeVer);
function podeConteudo(d) {
  const p = perm();
  if (p.conteudoEm === 'todas') return true;
  return d.responsavel === usuario().id && isAberta(d);
}
function statusPermitidos(d) {
  const p = perm();
  if (!isAberta(d) && !p.aprovarConclusao) return [];      // concluída: só o Gestor reabre
  return p.statusPermitidos;

/* Urgência do prazo: ícone + texto + cor (nunca só cor) */
function urgencia(d) {
  if (!isAberta(d)) return { k: 'neutro', i: 'checkc', t: 'Concluída' };
  const n = diasAte(d.prazo);
  if (n < 0) return { k: 'venc', i: 'alert', t: `Vencido há ${plural(-n, 'dia', 'dias')}` };
  if (n === 0) return { k: 'breve', i: 'clock', t: 'Vence hoje' };
  if (n <= 3) return { k: 'breve', i: 'clock', t: `Vence em ${plural(n, 'dia', 'dias')}` };
  return { k: 'ok', i: 'check', t: 'No prazo' };
}
const badgePrazo = d => { const u = urgencia(d); return `<span class="prazo ${u.k}">${ico(u.i)}${esc(u.t)}</span>`; };

function mostrarTip(el) {
  const t = $('#tooltip');
  t.textContent = el.dataset.tip; t.hidden = false;
  const r = el.getBoundingClientRect(), w = t.offsetWidth, h = t.offsetHeight;
  let x = Math.min(Math.max(8, r.left + r.width / 2 - w / 2), innerWidth - w - 8);
  let y = r.top - h - 8; if (y < 8) y = r.bottom + 8;
  t.style.left = x + 'px'; t.style.top = y + 'px';
}

/* ---------- Modal próprio: foco preso, Esc fecha, devolve os campos ou null ---------- */
function abrirModal({ titulo, corpo = '', confirmar = 'Confirmar', cancelar = 'Cancelar', perigo = false, validar = null, semConfirmar = false, larga = false }) {
  return new Promise(resolve => {
    const anterior = document.activeElement;
    const raiz = $('#modal-root');
    raiz.innerHTML = `<div class="modal-fundo"><div class="modal${larga ? ' larga' : ''}" role="dialog" aria-modal="true" aria-labelledby="modal-t">
      <h2 id="modal-t">${esc(titulo)}</h2><div class="modal-corpo">${corpo}</div>
      <p class="modal-erro" role="alert" hidden></p>
      <div class="modal-acoes"><button type="button" class="btn" data-m="cancel">${esc(cancelar)}</button>${semConfirmar ? '' : `<button type="button" class="btn ${perigo ? 'perigo' : 'primario'}" data-m="ok">${esc(confirmar)}</button>`}</div></div></div>`;
    const fundo = raiz.firstElementChild, modal = $('.modal', raiz);
    document.body.style.overflow = 'hidden';
    const fechar = valor => {
      document.body.style.overflow = ''; raiz.innerHTML = '';
      if (anterior && document.contains(anterior)) anterior.focus(); else $('#conteudo')?.focus();
      resolve(valor);
    };
    const coletar = () => Object.fromEntries($$('[name]', modal).map(c => [c.name, c.type === 'file' ? c.files[0] : c.value]));
    const focaveis = () => $$('button,input,select,textarea,a[href],[tabindex]:not([tabindex="-1"])', modal).filter(e => !e.disabled);
    modal.addEventListener('click', e => {
      const b = e.target.closest('[data-m]'); if (!b) return;
      if (b.dataset.m === 'cancel') return fechar(null);
      const campos = coletar();
      const erro = validar ? validar(campos) : null;
      if (erro) { const p = $('.modal-erro', modal); p.textContent = erro; p.hidden = false; (modal.querySelector('[name]') || b).focus(); return; }
      fechar(campos);
    });
    fundo.addEventListener('mousedown', e => { if (e.target === fundo) fechar(null); });
    modal.addEventListener('keydown', e => {
      if (e.key === 'Escape') { e.stopPropagation(); fechar(null); }
      else if (e.key === 'Tab') {
        const f = focaveis(); if (!f.length) return;
        const a = f[0], z = f[f.length - 1];
        if (e.shiftKey && document.activeElement === a) { e.preventDefault(); z.focus(); }
        else if (!e.shiftKey && document.activeElement === z) { e.preventDefault(); a.focus(); }
      }
    });
    (modal.querySelector('[name]') || $('[data-m="ok"]', modal) || $('[data-m="cancel"]', modal)).focus();
  });
}

/* ---------- Gráficos SVG (barras horizontais e rosca) ---------- */
function svgBarras(itens, titulo) {
  const max = Math.max(1, ...itens.map(i => i.val)), W = 320, H = 40, BM = 250;
  const h = itens.length * H + 4;
  const linhas = itens.map((it, i) => {
    const y = i * H + 2, w = it.val ? Math.max(4, Math.round(it.val / max * BM)) : 0;
    const tip = `${it.rot}: ${plural(it.val, 'demanda', 'demandas')}`;
    return `<g><text x="0" y="${y + 12}" class="g-rot">${esc(it.rot)}</text><rect x="0" y="${y + 18}" width="${BM}" height="14" rx="3" class="g-fundo"/>
      <rect x="0" y="${y + 18}" width="${w}" height="14" rx="3" fill="${it.cor}" tabindex="0" role="img" aria-label="${esc(tip)}" data-tip="${esc(tip)}"/>
      <text x="${BM + 8}" y="${y + 30}" class="g-val">${it.val}</text></g>`;
  }).join('');
  return `<svg class="graf" viewBox="0 0 ${W} ${h}" role="group" aria-label="${esc(titulo)}">${linhas}</svg>`;
}
function svgRosca(itens, titulo) {
  const total = itens.reduce((s, i) => s + i.val, 0);
  if (!total) return `<p class="dica">Sem dados no período.</p>`;
  const r = 15.9155; let acc = 0;
  const segs = itens.filter(i => i.val > 0).map(it => {
    const pct = it.val / total * 100, len = Math.max(pct - 0.7, 0.1);
    const tip = `${it.rot}: ${plural(it.val, 'demanda', 'demandas')} (${fPct.format(it.val / total)})`;
    const s = `<circle cx="21" cy="21" r="${r}" fill="none" stroke="${it.cor}" stroke-width="6" stroke-dasharray="${len} ${100 - len}" stroke-dashoffset="${25 - acc}" tabindex="0" role="img" aria-label="${esc(tip)}" data-tip="${esc(tip)}"/>`;
    acc += pct; return s;
  }).join('');
  const leg = itens.map(it => `<li><i style="background:${it.cor}"></i><span>${esc(it.rot)}: <strong>${fNum.format(it.val)}</strong> (${fPct.format(it.val / total)})</span></li>`).join('');
  return `<div class="rosca-wrap"><svg class="graf" viewBox="0 0 42 42" role="group" aria-label="${esc(titulo)}">${segs}<text x="21" y="22.5" class="g-centro">${total}</text><text x="21" y="26.5" class="g-cent2">demandas</text></svg>
    <ul class="legenda" aria-label="Legenda: ${esc(titulo)}">${leg}</ul></div>`;
}

    ${g ? `<div class="campo"><label for="f-resp">Responsável</label><select id="f-resp" data-filtro="resp">${opt([['', 'Todos'], ['none', 'Sem responsável'], ...INSPETORES.map(u => [u.id, u.nome])], f.resp)}</select></div>` : ''}

}

function filtroRotulos(f) {
  const r = [];
  if (f.q) r.push(['q', `Busca: “${f.q}”`]);
  if (f.status) r.push(['status', `Status: ${STATUS_FILTRO.find(x => x[0] === f.status)?.[1] ?? f.status}`]);
  if (f.prioridade) r.push(['prioridade', `Prioridade: ${f.prioridade}`]);
  if (f.prazo) r.push(['prazo', `Prazo: ${PRAZOS_FILTRO.find(x => x[0] === f.prazo)?.[1]}`]);
  if (f.origem) r.push(['origem', `Origem: ${f.origem}`]);
  if (f.resp && ehGestor()) r.push(['resp', `Responsável: ${f.resp === 'none' ? 'Sem responsável' : nomeDe(f.resp)}`]);
  return r;
}

function aplicarFiltros(lista, f) {
  const q = f.q.trim().toLowerCase();
  return lista.filter(d => {
    if (q && !`${d.id} ${d.titulo} ${d.estabelecimento} ${d.descricao}`.toLowerCase().includes(q)) return false;
    if (f.status === 'abertas' && !isAberta(d)) return false;
    if (f.status === 'aprovacao' && !(d.conclusaoSolicitada && isAberta(d))) return false;
    if (f.status && f.status !== 'abertas' && f.status !== 'aprovacao' && d.status !== f.status) return false;
    if (f.prioridade && d.prioridade !== f.prioridade) return false;
    if (f.origem && d.origem !== f.origem) return false;
    if (f.resp && ehGestor() && (f.resp === 'none' ? d.responsavel : d.responsavel !== f.resp)) return false;
    if (f.prazo) {
      if (!isAberta(d)) return false;
      const n = diasAte(d.prazo);
      if (f.prazo === 'vencidas') { if (n >= 0) return false; }
      else if (f.prazo === 'hoje') { if (n !== 0) return false; }
      else { const lim = { ate3: 3, ate7: 7, ate15: 15 }[f.prazo]; if (n < 0 || n > lim) return false; }
    }
    return true;
  });
}

const ORD_CHAVE = {
  id: d => d.id, titulo: d => d.titulo.toLowerCase(), resp: d => d.responsavel ? nomeDe(d.responsavel) : '~',
  status: d => STATUS.indexOf(d.status), prioridade: d => PRIORIDADES.indexOf(d.prioridade),
  prazo: d => isAberta(d) ? d.prazo : '9999-' + d.prazo
};
function ordenar(lista, ord) {
  const k = ORD_CHAVE[ord.col] || ORD_CHAVE.prazo, s = ord.dir === 'desc' ? -1 : 1;
  return [...lista].sort((a, b) => { const x = k(a), y = k(b); return (typeof x === 'number' ? x - y : String(x).localeCompare(String(y), 'pt-BR')) * s || a.id.localeCompare(b.id); });
}

/* ---------- Relatórios ---------- */
function dadosRelatorio(dias) {
  const g = ehGestor(), base = g ? estado.demandas : estado.demandas.filter(d => d.responsavel === usuario().id);
  const inicio = addDias(HOJE, -dias);
  const criadas = base.filter(d => parseISO(d.criada) >= inicio);
  const concl = base.filter(d => d.concluidaEm && parseISO(d.concluidaEm) >= inicio);
  const abertas = base.filter(isAberta);
  const tempos = concl.map(d => Math.max(0, diasEntre(parseISO(d.criada), parseISO(d.concluidaEm))));
  return { base, inicio, criadas, concl, abertas, venc: abertas.filter(d => diasAte(d.prazo) < 0), tmedio: tempos.length ? tempos.reduce((a, b) => a + b, 0) / tempos.length : null };
}

function viewRelatorios() {
  const g = ehGestor(), dias = estado.relPeriodo, r = dadosRelatorio(dias);
  const porStatus = STATUS.map(s => ({ rot: s, val: r.criadas.filter(d => d.status === s).length, cor: STATUS_INFO[s].cor }));
  const porTipo = TIPOS.map((t, i) => ({ rot: t, val: r.criadas.filter(d => d.tipo === t).length, cor: CORES[i] })).filter(x => x.val);
  const n = d => diasAte(d.prazo);

/* ---------- Mapa de demandas ---------- */
const COR_URG = { venc: '#b91c1c', breve: '#b26a00', ok: '#2f7d32', neutro: '#6b7280' };
const ROT_URG = { venc: 'Vencida', breve: 'Vence em até 3 dias', ok: 'No prazo', neutro: 'Concluída' };
let mapaLeaflet = null, camadaPontos = null, camadaMun = null, dadosMapa = null, marcadores = {};

function viewMapa() {
  const f = estado.mapaFiltros;
  const opt = (arr, atual) => arr.map(([v, t]) => `<option value="${esc(v)}"${v === atual ? ' selected' : ''}>${esc(t)}</option>`).join('');

    <div class="campo"><label for="m-prazo">Prazo</label><select id="m-prazo" data-change="mapaFiltro" data-arg="prazo">${opt(PRAZOS_FILTRO, f.prazo)}</select></div>
    <div class="campo"><label for="m-tipo">Tipo</label><select id="m-tipo" data-change="mapaFiltro" data-arg="tipo">${opt([['', 'Todos os tipos'], ...TIPOS.map(t => [t, t])], f.tipo)}</select></div>
    <div class="campo"><label for="m-mun">Município</label><select id="m-mun" data-change="mapaFiltro" data-arg="municipio">${opt([['', 'Todos'], ...MUNICIPIOS.map(m => [m, m])], f.municipio)}</select></div>
  </form>
  <div class="grade g-mapa" style="margin-top:8px">
    <section class="card" aria-labelledby="h-mapa"><h2 id="h-mapa">${ico('map')}Mapa</h2>
      <div id="mapa" role="region" aria-label="Mapa das demandas. A mesma informação está na lista de locais ao lado."></div>
      <div class="mapa-legenda">${['venc', 'breve', 'ok', 'neutro'].map(k => `<span><i style="background:${COR_URG[k]}"></i>${ROT_URG[k]}</span>`).join('')}<span>O número no círculo é a quantidade de demandas no local; a cor é a situação mais urgente.</span></div></section>
    <section class="card" aria-labelledby="h-locais"><h2 id="h-locais">${ico('list')}Locais</h2><p class="contador" id="mapa-contador" role="status"></p><ul class="itens locais" id="mapa-locais"></ul></section>
  </div>`;
}

function filtrarMapa(lista) {
  const f = estado.mapaFiltros;
  return lista.filter(d => {
    const dem = buscar(d.id) || d, n = diasAte(d.prazo);
    if (f.status === 'abertas' && !isAberta(dem)) return false;
    if (f.status === 'aprovacao' && !(dem.conclusaoSolicitada && isAberta(dem))) return false;
    if (f.status && !['abertas', 'aprovacao'].includes(f.status) && dem.status !== f.status) return false;
    if (f.tipo && d.tipo !== f.tipo) return false;
    if (f.prazo) {
      if (!isAberta(dem)) return false;
      if (f.prazo === 'vencidas') { if (n >= 0) return false; }
      else if (f.prazo === 'hoje') { if (n !== 0) return false; }
      else { const lim = { ate3: 3, ate7: 7, ate15: 15 }[f.prazo]; if (n < 0 || n > lim) return false; }
    }
    return true;
  });
}

async function montarMapa() {
  const el = $('#mapa'); if (!el) return;
  if (!window.L) { el.innerHTML = '<p class="dica" style="padding:16px">Não foi possível carregar o componente de mapa.</p>'; return; }
  if (mapaLeaflet) { mapaLeaflet.remove(); mapaLeaflet = null; }
  mapaLeaflet = L.map(el, { scrollWheelZoom: false }).setView([-8.06, -34.95], 10);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '&copy; OpenStreetMap' }).addTo(mapaLeaflet);
  mapaLeaflet.attributionControl.addAttribution('Limites municipais: IBGE');
  try {
    const [geo, pts] = await Promise.all([fetch('/static/data/rmr_municipios.geojson').then(r => r.json()), api('GET', '/api/mapa')]);
    if (!$('#mapa')) return;
    dadosMapa = { geo, pts };
    desenharPontos(true);
  } catch (e) { toast(e.message); }
}

function desenharPontos(enquadrar = false) {
  if (!mapaLeaflet || !dadosMapa) return;
  const f = estado.mapaFiltros;
  const pontos = dadosMapa.pts.pontos
    .filter(p => !f.municipio || p.rotulo === f.municipio || p.rotulo.endsWith(' · ' + f.municipio))
    .map(p => ({ ...p, lista: filtrarMapa(p.demandas) })).filter(p => p.lista.length);
  const porMun = {};
  pontos.forEach(p => { const m = p.nivel === 'bairro' ? 'Recife' : p.rotulo; porMun[m] = (porMun[m] || 0) + p.lista.length; });
  const maxMun = Math.max(1, ...Object.values(porMun));
  if (camadaMun) camadaMun.remove();
  camadaMun = L.geoJSON(dadosMapa.geo, {
    style: ft => { const n = porMun[ft.properties.nome] || 0; return { color: '#14305a', weight: 1, fillColor: '#1f4a8a', fillOpacity: n ? 0.05 + 0.2 * n / maxMun : 0.02 }; },
    onEachFeature: (ft, layer) => layer.bindTooltip(`${ft.properties.nome}: ${plural(porMun[ft.properties.nome] || 0, 'demanda', 'demandas')} no filtro`, { sticky: true })
  }).addTo(mapaLeaflet);
  if (camadaPontos) camadaPontos.remove();
  camadaPontos = L.layerGroup().addTo(mapaLeaflet); marcadores = {};
  const pior = lista => lista.reduce((a, d) => (({ venc: 3, breve: 2, ok: 1, neutro: 0 })[d.urgencia.k] > ({ venc: 3, breve: 2, ok: 1, neutro: 0 })[a] ? d.urgencia.k : a), 'neutro');
  pontos.sort((a, b) => b.lista.length - a.lista.length);
  pontos.forEach(p => {
    const k = pior(p.lista), tam = 24 + Math.min(22, p.lista.length * 4);
    const icone = L.divIcon({ className: '', html: `<div class="pino" style="width:${tam}px;height:${tam}px;background:${COR_URG[k]}">${p.lista.length}</div>`, iconSize: [tam, tam], iconAnchor: [tam / 2, tam / 2] });
    const itens = [...p.lista].sort((a, b) => a.prazo.localeCompare(b.prazo)).map(d => `<li><a href="#/demanda/${enc(d.id)}">${esc(d.titulo)}</a><br><span class="prazo ${d.urgencia.k}">${esc(d.urgencia.t)}</span> · ${esc(d.status)}${d.responsavel ? ' · ' + esc(nomeDe(d.responsavel)) : ''}</li>`).join('');
    marcadores[p.rotulo] = L.marker([p.lat, p.lng], { icon: icone, title: `${p.rotulo}: ${p.lista.length}`, keyboard: true })
      .bindPopup(`<div class="pop"><h3>${esc(p.rotulo)}</h3><ul>${itens}</ul></div>`, { maxWidth: 320 }).addTo(camadaPontos);
  });
  const total = pontos.reduce((s, p) => s + p.lista.length, 0);
  $('#mapa-contador').textContent = `${plural(total, 'demanda', 'demandas')} em ${plural(pontos.length, 'local', 'locais')}`;
  $('#mapa-locais').innerHTML = pontos.length ? pontos.map(p => {
    const venc = p.lista.filter(d => d.urgencia.k === 'venc').length, k = pior(p.lista);
    return `<li class="item" tabindex="0" data-action="focarLocal" data-arg="${esc(p.rotulo)}"><div class="tx"><strong>${esc(p.rotulo)}</strong><div class="sub">${plural(p.lista.length, 'demanda', 'demandas')}${venc ? ` · <span class="prazo venc">${ico('alert')}${plural(venc, 'vencida', 'vencidas')}</span>` : ''}</div></div><span class="prazo ${k}">${esc(ROT_URG[k])}</span></li>`;
  }).join('') : `<li class="dica" style="list-style:none">Nenhuma demanda com esses filtros.</li>`;
  if (enquadrar || f.municipio) {
    const ll = pontos.map(p => [p.lat, p.lng]);
    if (ll.length === 1) mapaLeaflet.setView(ll[0], 13); else if (ll.length) mapaLeaflet.fitBounds(ll, { padding: [40, 40], maxZoom: 13 });
  }
}

function focarLocal(rotulo) {
  const m = marcadores[rotulo]; if (!m || !mapaLeaflet) return;
  mapaLeaflet.setView(m.getLatLng(), Math.max(mapaLeaflet.getZoom(), 13)); m.openPopup();
  $('#mapa').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

const TELAS = ['dashboard', 'lista', 'nova', 'demanda', 'mapa', 'relatorios', 'equipe'];
let shellUser = null;

function parseHash() {
  const h = (location.hash || '').replace(/^#\/?/, '');
  const [tela, ...resto] = h.split('/');
  let arg = resto.join('/');
  try { arg = decodeURIComponent(arg); } catch (e) { /* mantém bruto */ }
  return { tela: tela || '', arg };
}
function irPara(hash) { if (location.hash === hash) rotear(true); else location.hash = hash; }

function renderShell() {

        <button type="button" class="btn peq" data-action="mapa">${ico('map')}Mapa</button>

function renderLogin() {
  document.documentElement.dataset.perfil = 'gestor';
  shellUser = null;
  $('#app').innerHTML = viewLogin();
  document.title = 'Entrar · VISAT Manager';
  $('#l-user').focus();
}

function rotear(foco = true) {
  esconderTip();
  const { tela, arg } = parseHash();
  if (!usuario() || !estado.token) {
    estado.sessao = null;
    if (tela !== 'login') { location.replace('#/login'); return; }
    renderLogin(); return;
  }
  if (tela === 'login' || !TELAS.includes(tela)) { location.replace('#/dashboard'); return; }
  if (tela === 'equipe' && !perm().equipe) { toast('Equipe: somente Gestor.'); location.replace('#/dashboard'); return; }
  if (!$('#shell') || shellUser !== estado.sessao) renderShell();
  const ehG = ehGestor();
  const html = { dashboard: () => ehG ? viewDashGestor() : viewDashInspetor(), lista: viewLista, nova: viewNova, demanda: () => viewDetalhe(arg), mapa: viewMapa, relatorios: viewRelatorios, equipe: viewEquipe }[tela]();
  const foc = document.activeElement, chave = foc && foc.dataset && foc.dataset.action && foc.dataset.id ? `[data-action="${foc.dataset.action}"][data-id="${CSS.escape(foc.dataset.id)}"]` : null;
  $('#conteudo').innerHTML = html;
  if (tela === 'lista') atualizarLista();
  if (tela === 'mapa') montarMapa(); else if (mapaLeaflet) { mapaLeaflet.remove(); mapaLeaflet = null; }
  document.title = `${TITULOS[tela][usuario().perfil]} · VISAT Manager`;
  const ativa = tela === 'demanda' ? 'lista' : tela;
  $$('#side nav a').forEach(a => { const on = a.dataset.tela === ativa; a.classList.toggle('ativo', on); if (on && tela === ativa) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); if (on && tela !== ativa) a.setAttribute('aria-current', 'true'); });
  $('#shell').classList.remove('menu-aberto'); $('.menu-btn')?.setAttribute('aria-expanded', 'false');
  if (foco) { const h = $('#conteudo h1'); if (h) { h.tabIndex = -1; h.focus({ preventScroll: true }); } window.scrollTo(0, 0); }
  else if (chave) $(chave)?.focus();
}
const renderAtual = () => rotear(false);

async function entrar(perfil, user = 'demo', senha = 'demo') {
  const r = await api('POST', '/api/login', { user, senha, perfil });
  estado.token = r.token; estado.sessao = r.usuario.id; estado.ultimoLogin = r.usuario.id;
  await recarregar(); salvar();
  if (parseHash().tela === 'dashboard') rotear(true); else irPara('#/dashboard');
}
const negar = motivo => { toast(motivo); return false; };
const filtrosAtalho = extra => ({ ...filtrosPadrao(), ord: estado.filtros.ord, ...extra });

function setErro(id, msg) {
  const e = $('#e-' + id), c = $('#' + id);
  if (e) { e.innerHTML = msg ? ico('alert') + esc(msg) : ''; e.hidden = !msg; }
  if (c) c.setAttribute('aria-invalid', msg ? 'true' : 'false');
}


async function fluxoAtribuir(ids) {
  if (!perm().atribuir) return negar(MOTIVOS.atribuir);
  const jaTem = ids.filter(id => buscar(id)?.responsavel).length;
  const r = await abrirModal({
    titulo: 'Atribuir demandas',
    corpo: `<p>${plural(ids.length, 'demanda selecionada', 'demandas selecionadas')}.${jaTem ? ` ${plural(jaTem, 'já tem responsável e será reatribuída', 'já têm responsável e serão reatribuídas')}.` : ''}</p>
      <div class="campo"><label for="m-resp">Atribuir a</label><select id="m-resp" name="resp"><option value="">Selecione um inspetor…</option>${INSPETORES.map(i => `<option value="${i.id}">${esc(i.nome)}</option>`).join('')}</select></div>`,
    confirmar: 'Confirmar atribuição', validar: c => c.resp ? null : 'Selecione um inspetor.'
  });
  if (!r) return;
  selecionadas.clear();
  const res = await executar(() => api('POST', '/api/demandas/atribuir', { ids, resp: r.resp }));
  if (!res) return;
  const n = res.alteradas;
  toast(n ? `${plural(n, 'demanda atribuída', 'demandas atribuídas')} a ${nomeDe(r.resp)}.` : 'Nenhuma alteração: já estavam com esse responsável.');
}


async function atualizarStatus(id) {
  const d = buscar(id); if (!d || !podeVer(d)) return;
  const novo = $('#g-status').value;
  if (novo === d.status) return toast(`O status já é "${novo}".`);
  if (!statusPermitidos(d).includes(novo)) return negar(novo === 'Concluída' ? MOTIVOS.concluir : MOTIVOS.reabrir);
  let obs = null;
  if (novo === 'Concluída') {
    const r = await abrirModal({ titulo: 'Concluir demanda', corpo: `<p>A demanda <strong>${esc(d.titulo)}</strong> será marcada como concluída.</p>${campoObs('Observação de conclusão', true)}`, confirmar: 'Concluir demanda', validar: validarObs('A observação é obrigatória para concluir.') });
    if (!r) return; obs = r.obs.trim();
  } else if (!isAberta(d)) {
    const r = await abrirModal({ titulo: 'Reabrir demanda', corpo: `<p>A demanda voltará ao status <strong>${esc(novo)}</strong>.</p>${campoObs('Motivo da reabertura', true)}`, confirmar: 'Reabrir', validar: validarObs('Informe o motivo da reabertura.') });
    if (!r) return; obs = r.obs.trim();
  }
  if (!await executar(() => api('POST', urlDemanda(id, '/status'), { status: novo, obs }))) return;
  toast(`Status atualizado para "${novo}".`, { href: '#/lista', rotulo: 'Voltar à lista' });
}

async function solicitarConclusao(id) {
  const d = buscar(id); if (!d || !perm().solicitarConclusao || !podeVer(d)) return;
  if (!isAberta(d)) return negar(MOTIVOS.reabrir);
  if (d.conclusaoSolicitada) return negar(MOTIVOS.solicitarPendente);
  const r = await abrirModal({ titulo: 'Solicitar conclusão', corpo: `<p>O Gestor será notificado no painel para aprovar a conclusão de <strong>${esc(d.titulo)}</strong>.</p>${campoObs('Observação para o Gestor', true, 'Descreva o que foi feito e o resultado.')}`, confirmar: 'Solicitar conclusão', validar: validarObs('A observação é obrigatória para solicitar a conclusão.') });
  if (!r) return;
  if (!await executar(() => api('POST', urlDemanda(id, '/solicitar-conclusao'), { obs: r.obs.trim() }))) return;
  toast('Conclusão solicitada. Aguardando aprovação do Gestor.', { href: '#/lista', rotulo: 'Voltar à lista' });
}

async function aprovar(id) {
  const d = buscar(id); if (!d) return;
  if (!perm().aprovarConclusao) return negar(MOTIVOS.concluir);
  const s = d.conclusaoSolicitada; if (!s) return;
  const r = await abrirModal({ titulo: 'Aprovar conclusão', corpo: `<p>Concluir <strong>${esc(d.titulo)}</strong>, solicitada por ${esc(nomeDe(s.por))}?</p><blockquote>${escBr(s.obs)}</blockquote>`, confirmar: 'Aprovar e concluir' });
  if (!r) return;
  if (!await executar(() => api('POST', urlDemanda(id, '/aprovar')))) return;
  toast('Conclusão aprovada.');
}

async function devolver(id) {
  const d = buscar(id); if (!d) return;
  if (!perm().aprovarConclusao) return negar(MOTIVOS.concluir);
  const r = await abrirModal({ titulo: 'Devolver ao inspetor', corpo: `<p>A demanda continua em aberto com o inspetor.</p>${campoObs('Motivo da devolução', true)}`, confirmar: 'Devolver', validar: validarObs('Informe o motivo da devolução.') });
  if (!r) return;
  if (!await executar(() => api('POST', urlDemanda(id, '/devolver'), { obs: r.obs.trim() }))) return;
  toast('Solicitação devolvida ao inspetor.');
}

async function salvarGestao(id) {
  const d = buscar(id), p = perm(); if (!d || !(p.atribuir || p.prioridadePrazo)) return negar(MOTIVOS.atribuir);
  const resp = $('#g-resp').value || null, prior = $('#g-prior').value, prazo = $('#g-prazo').value;
  setErro('g-prazo', '');
  if (!prazo) { setErro('g-prazo', 'Informe o prazo.'); $('#g-prazo').focus(); return; }
  if (prazo !== d.prazo && prazo < HOJE_ISO) { setErro('g-prazo', 'O prazo não pode estar no passado.'); $('#g-prazo').focus(); return; }
  const mResp = resp !== (d.responsavel || null), mPr = prior !== d.prioridade, mPz = prazo !== d.prazo;
  if (!mResp && !mPr && !mPz) return toast('Nenhuma alteração para salvar.');
  if (mResp) {
    const r = await abrirModal({ titulo: 'Confirmar reatribuição', corpo: `<p>${d.responsavel ? `Reatribuir de <strong>${esc(nomeDe(d.responsavel))}</strong> para` : 'Atribuir a'} <strong>${esc(resp ? nomeDe(resp) : 'ninguém (sem responsável)')}</strong>?</p>`, confirmar: 'Confirmar' });
    if (!r) return;
  }
  if (!await executar(() => api('POST', urlDemanda(id, '/gestao'), { resp, prioridade: prior, prazo }))) return;
  toast('Alterações salvas.', { href: '#/lista', rotulo: 'Voltar à lista' });
}

async function anexar(id) {
  const d = buscar(id); if (!d) return;
  if (!podeConteudo(d)) return negar(MOTIVOS.conteudo);
  const r = await abrirModal({ titulo: 'Anexar documento', corpo: `<div class="campo"><label for="m-arq">Arquivo</label><input id="m-arq" name="arquivo" type="file"><span class="dica">O arquivo é enviado ao servidor e fica guardado na demanda (até 10 MB).</span></div>`, confirmar: 'Anexar', validar: c => c.arquivo ? null : 'Selecione um arquivo.' });
  if (!r) return;
  if (r.arquivo.size > 10 * 1024 * 1024) return toast('Arquivo maior que 10 MB.');
  const fd = new FormData(); fd.append('arquivo', r.arquivo);
  if (!await executar(() => api('POST', urlDemanda(id, '/documentos'), fd))) return;
  toast('Documento anexado.');
}

async function previa(id, docId) {
  const d = buscar(id), x = d?.docs.find(k => k.id === docId); if (!x) return;
  if (x.arquivo) {
    let blob; try { blob = await api('GET', urlDemanda(id, '/documentos/' + encodeURIComponent(x.id)), undefined, { arquivo: true }); } catch (e) { return toast(e.message); }
    const url = URL.createObjectURL(blob), tipo = blob.type || '';
    const corpo = tipo.startsWith('image/') ? `<img class="previa-real" src="${url}" alt="${esc(x.nome)}">`
      : tipo === 'application/pdf' ? `<object class="previa-real" data="${url}" type="application/pdf" style="width:100%;height:70vh"><p>Não foi possível exibir o PDF aqui.</p></object>`
      : `<p>Este tipo de arquivo não tem pré-visualização.</p>`;
    await abrirModal({ titulo: `Pré-visualização: ${x.nome}`, semConfirmar: true, cancelar: 'Fechar', larga: true,
      corpo: `${corpo}<p style="margin-top:10px"><a href="${url}" download="${esc(x.nome)}">${ico('download')} Baixar ${esc(x.nome)} (${esc(fmtTam(x.tam))})</a></p>` });
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    return;
  }
  abrirModal({ titulo: `Pré-visualização: ${x.nome}`, semConfirmar: true, cancelar: 'Fechar', larga: true,
    corpo: `<div class="previa" role="img" aria-label="Pré-visualização fictícia do documento"><strong>${esc(x.nome)}</strong><div class="l" style="width:60%"></div><div class="l"></div><div class="l"></div><div class="l" style="width:85%"></div><div class="l"></div><div class="l" style="width:40%"></div></div><p class="dica" style="margin-top:8px">Documento dos dados de exemplo: só o registro existe, o arquivo não foi armazenado.</p>` });
}

function sincronizar() {
  if (!perm().sincronizarSEI) return negar(MOTIVOS.sincronizarSEI);
  if (sincronizando) return;
  sincronizando = true; renderAtual();
  api('POST', '/api/sync/sei').then(async r => {
    await recarregar(); sincronizando = false; salvar(); renderAtual();
    const rej = r.invalidos ? ` ${plural(r.invalidos, 'registro rejeitado', 'registros rejeitados')} na validação.` : '';
    toast(r.novos ? `${plural(r.novos, 'nova demanda importada', 'novas demandas importadas')} do SEI.${rej}` : `Nenhuma demanda nova no SEI.${rej}`,
      r.novos ? { href: '#/lista', rotulo: 'Ver na lista' } : null);
  }).catch(e => { sincronizando = false; renderAtual(); toast(e.message); });
}

function exportar() {
  if (!perm().exportar) return negar(MOTIVOS.exportar);
  const r = dadosRelatorio(estado.relPeriodo);
  const cel = v => { v = String(v ?? ''); if (/^[=+\-@\t\r]/.test(v)) v = "'" + v; return '"' + v.replace(/"/g, '""') + '"'; };
  const linhas = [['Número', 'Título', 'Origem', 'Tipo', 'Estabelecimento', 'Status', 'Prioridade', 'Responsável', 'Prazo', 'Criada em']]
    .concat(r.criadas.map(d => [d.id, d.titulo, d.origem, d.tipo, d.estabelecimento, d.status, d.prioridade, d.responsavel ? nomeDe(d.responsavel) : 'Sem responsável', fmtData(d.prazo), fmtDataHora(d.criada)]));
  const blob = new Blob(['﻿' + linhas.map(l => l.map(cel).join(';')).join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `demandas-visat-${HOJE_ISO}.csv`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast(`Exportadas ${plural(r.criadas.length, 'demanda', 'demandas')} do período.`);
}

async function restaurar() {
  const r = await abrirModal({ titulo: 'Restaurar dados de exemplo', corpo: '<p>Todas as alterações feitas neste protótipo (demandas, filtros e observações) serão descartadas e os dados de exemplo voltam ao estado inicial.</p>', confirmar: 'Restaurar', perigo: true });
  if (!r) return;
  selecionadas.clear();
  if (!await executar(() => api('POST', '/api/restaurar'))) return;
  toast('Dados de exemplo restaurados.');
}

/* Tabela de ações disparadas por data-action */
function pdfPeriodo() { baixarArquivo(`/api/relatorios.pdf?dias=${estado.relPeriodo}`, `relatorio-visat-${HOJE_ISO}-${estado.relPeriodo}d.pdf`).then(ok => ok && toast('Relatório em PDF gerado.')); }
function pdfDemanda(id) { baixarArquivo(urlDemanda(id, '/relatorio.pdf'), `relatorio-${id.replace(/[^\w-]/g, '_')}.pdf`).then(ok => ok && toast('Relatório da demanda gerado.')); }

const ACOES = {
  nav: el => irPara(el.dataset.arg),
  abrir: el => irPara('#/demanda/' + enc(el.dataset.id)),
  menu: () => { const s = $('#shell'); s.classList.toggle('menu-aberto'); $('.menu-btn').setAttribute('aria-expanded', s.classList.contains('menu-aberto')); },
  sair: () => { api('POST', '/api/logout').catch(() => {}); estado.token = null; estado.sessao = null; estado.demandas = []; selecionadas.clear(); salvar(); irPara('#/login'); },
  pdfPeriodo, pdfDemanda: el => pdfDemanda(el.dataset.id),
  focarLocal: el => focarLocal(el.dataset.arg),
  mapa: () => abrirModal({ titulo: 'Mapa de navegação', corpo: `<div class="mapa">${mapaSVG(parseHash().tela)}</div>`, semConfirmar: true, cancelar: 'Fechar', larga: true }),
  mostrarSenha: el => { const i = $('#l-pass'), v = i.type === 'password'; i.type = v ? 'text' : 'password'; el.setAttribute('aria-pressed', v); el.setAttribute('aria-label', v ? 'Ocultar senha' : 'Mostrar senha'); el.innerHTML = ico(v ? 'eyeoff' : 'eye'); },
  restaurar, sincronizar, exportar,
  kpi: el => {
    const a = el.dataset.arg;
    const mapa = { abertas: { status: 'abertas' }, 'sem-resp': { status: 'abertas', resp: 'none' }, vencidas: { prazo: 'vencidas' }, ate15: { prazo: 'ate15' }, ate7: { prazo: 'ate7' }, hoje: { prazo: 'hoje' }, aprovacao: { status: 'aprovacao' }, aguardando: { status: 'Aguardando documento' } };
    estado.filtros = filtrosAtalho(mapa[a] || {}); selecionadas.clear(); salvar(); irPara('#/lista');
  },
  verDoInspetor: el => { estado.filtros = filtrosAtalho({ resp: el.dataset.arg }); selecionadas.clear(); salvar(); irPara('#/lista'); },
  ordenar: el => { const o = estado.filtros.ord, c = el.dataset.arg; estado.filtros.ord = { col: c, dir: o.col === c && o.dir === 'asc' ? 'desc' : 'asc' }; estado.filtros.pag = 1; salvar(); atualizarLista(); $(`[data-action="ordenar"][data-arg="${c}"]`)?.focus(); },
  pagina: el => { estado.filtros.pag += Number(el.dataset.arg); selecionadas.clear(); salvar(); atualizarLista(); $('#contador')?.scrollIntoView({ block: 'nearest' }); },
  limparFiltros: () => { estado.filtros = filtrosAtalho({}); salvar(); $$('[data-filtro]').forEach(c => { c.value = ''; }); atualizarLista(); },
  removerChip: el => { const k = el.dataset.arg; estado.filtros[k] = ''; estado.filtros.pag = 1; salvar(); const c = $(`[data-filtro="${k}"]`); if (c) c.value = ''; atualizarLista(); },
  limparSelecao: () => { selecionadas.clear(); $$('[data-check]').forEach(c => { c.checked = false; }); $$('tr.sel').forEach(t => t.classList.remove('sel')); atualizarBarraLote(); },
  atribuirLote: () => fluxoAtribuir([...selecionadas]),
  atribuirUma: el => fluxoAtribuir([el.dataset.id]),
  atualizarStatus: el => atualizarStatus(el.dataset.id),
  solicitarConclusao: el => solicitarConclusao(el.dataset.id),
  concluirDireto: () => negar(MOTIVOS.concluir),
  aprovar: el => aprovar(el.dataset.id),
  devolver: el => devolver(el.dataset.id),
  salvarGestao: el => salvarGestao(el.dataset.id),
  anexar: el => anexar(el.dataset.id),
  previa: el => previa(el.dataset.id, el.dataset.arg)
};

const CHANGE = {
  trocar: el => {
    const u = USUARIOS.find(x => x.id === el.value); if (!u) return;
    estado.filtros.resp = ''; estado.filtros.pag = 1; selecionadas.clear();
    api('POST', '/api/login', { user: 'demo', senha: 'demo', perfil: u.id }).then(async r => {
      estado.token = r.token; estado.sessao = u.id; estado.ultimoLogin = u.id; await recarregar(); salvar();
      rotear(false); $('#troca')?.focus();
      toast(`Perfil alterado para ${PERMS[u.perfil].rotulo}: ${u.nome}.`);
    }).catch(e => toast(e.message));
  },
  statusRapido: el => {
    const d = buscar(el.dataset.id); if (!d || !podeVer(d)) return;
    const novo = el.value;
    if (!statusPermitidos(d).includes(novo)) { el.value = d.status; return negar(MOTIVOS.concluir); }
    executar(() => api('POST', urlDemanda(d.id, '/status'), { status: novo })).then(ok => ok && toast(`Status de "${d.titulo}" atualizado para ${novo}.`));
  },
  mapaFiltro: el => { estado.mapaFiltros[el.dataset.arg] = el.value; salvar(); desenharPontos(); },
  periodo: el => { estado.relPeriodo = Number(el.value); salvar(); renderAtual(); $(`input[name="periodo"][value="${el.value}"]`)?.focus(); }
};

const FORMS = {
  login: () => {
    const u = $('#l-user').value.trim(), s = $('#l-pass').value;
    setErro('l-user', u ? '' : 'Informe o usuário.'); setErro('l-pass', s ? '' : 'Informe a senha.');
    if (!u) return $('#l-user').focus(); if (!s) return $('#l-pass').focus();
    entrar($('#l-perfil').value, u, s).catch(err => { setErro('l-pass', err.message); $('#l-pass').focus(); });
  },
  filtros: () => { },
  obs: f => {
    const d = buscar(f.dataset.id); if (!d) return;
    if (!podeConteudo(d)) return negar(MOTIVOS.conteudo);
    const t = $('#o-texto').value.trim();
    if (!t) { setErro('o-texto', 'Escreva a observação antes de registrar.'); $('#o-texto').focus(); return; }
    executar(() => api('POST', urlDemanda(d.id, '/observacoes'), { texto: t })).then(ok => ok && toast('Observação registrada.'));
  },
  nova: (f, e) => {
    const g = ehGestor(), destino = e.submitter?.dataset.destino || 'detalhes';
    const erros = {};
    if (!$('#n-titulo').value.trim()) erros['n-titulo'] = 'Informe o título da demanda.';
    if (g) { const pz = $('#n-prazo').value; if (!pz) erros['n-prazo'] = 'Informe o prazo.'; else if (pz < HOJE_ISO) erros['n-prazo'] = 'O prazo não pode estar no passado.'; }
    ['n-titulo', 'n-prazo'].forEach(k => setErro(k, erros[k] || ''));
    const chaves = Object.keys(erros), resumo = $('#resumo-erros');
    resumo.hidden = !chaves.length; resumo.textContent = chaves.length ? `Corrija ${plural(chaves.length, 'campo', 'campos')} antes de continuar.` : '';
    if (chaves.length) { $('#' + chaves[0]).focus(); return; }
    const corpo = { titulo: $('#n-titulo').value.trim(), descricao: $('#n-desc').value.trim(), tipo: $('#n-tipo').value, estabelecimento: $('#n-estab').value.trim(),
      municipio: $('#n-mun').value, bairro: $('#n-bairro').value.trim() || null,
      resp: g ? ($('#n-resp').value || null) : null, prioridade: g ? $('#n-prior').value : 'Média', prazo: g ? $('#n-prazo').value : null };
    const botoes = $$('#form-nova button[type="submit"]'); botoes.forEach(b => b.setAttribute('aria-disabled', 'true'));
    api('POST', '/api/demandas', corpo).then(async d => {
      await recarregar(); estado.filtros = filtrosAtalho({}); salvar();
      toast(`Demanda ${d.id} cadastrada.`);
      irPara(destino === 'lista' ? '#/lista' : '#/demanda/' + enc(d.id));
    }).catch(err => { botoes.forEach(b => b.removeAttribute('aria-disabled')); resumo.hidden = false; resumo.textContent = err.message; });
  }
};

/* =====================================================================
   9. EVENTOS GLOBAIS (delegação) E INICIALIZAÇÃO
   ===================================================================== */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]'); if (!el) return;
  if (el.getAttribute('aria-disabled') === 'true') { e.preventDefault(); if (el.dataset.tip) toast(el.dataset.tip); return; }
  if (el.tagName === 'TR' && e.target.closest('input,select,textarea,label,a,button')) return;
  const fn = ACOES[el.dataset.action]; if (!fn) return;
  if (el.tagName === 'A') e.preventDefault();
  fn(el, e);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches?.('tr[data-action="abrir"]')) { e.preventDefault(); ACOES.abrir(e.target); }
  if (e.key === 'Enter' && e.target.matches?.('li[data-action="focarLocal"]')) { e.preventDefault(); ACOES.focarLocal(e.target); }
  if (e.key === 'Escape') { esconderTip(); const s = $('#shell'); if (s?.classList.contains('menu-aberto')) { s.classList.remove('menu-aberto'); $('.menu-btn')?.setAttribute('aria-expanded', 'false'); $('.menu-btn')?.focus(); } }
});
document.addEventListener('input', e => {
  const c = e.target.closest('[data-filtro]');
  if (c) { estado.filtros[c.dataset.filtro] = c.value; estado.filtros.pag = 1; selecionadas.clear(); salvar(); atualizarLista(); return; }
  if (e.target.id === 'n-titulo' || e.target.id === 'n-prazo') setErro(e.target.id, '');
  if (e.target.id === 'l-user' || e.target.id === 'l-pass') setErro(e.target.id, '');
});
document.addEventListener('change', e => {
  const c = e.target.closest('[data-change]'); if (c && CHANGE[c.dataset.change]) { CHANGE[c.dataset.change](c, e); return; }
  const k = e.target.closest('[data-check]'); if (!k) return;
  const marcar = box => { box.checked ? selecionadas.add(box.dataset.id) : selecionadas.delete(box.dataset.id); box.closest('tr').classList.toggle('sel', box.checked); };
  if (k.dataset.check === 'todos') $$('[data-check="linha"]').forEach(b => { b.checked = k.checked; marcar(b); }); else marcar(k);
  atualizarBarraLote();
});
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form]'); if (!f) return;
  e.preventDefault(); FORMS[f.dataset.form]?.(f, e);
});
['mouseover', 'focusin'].forEach(ev => document.addEventListener(ev, e => { const t = e.target.closest?.('[data-tip]'); if (t) mostrarTip(t); else if (ev === 'mouseover') esconderTip(); }));
['mouseout', 'focusout'].forEach(ev => document.addEventListener(ev, e => { if (e.target.closest?.('[data-tip]')) esconderTip(); }));
addEventListener('scroll', esconderTip, true);
addEventListener('hashchange', () => rotear(true));

(async function iniciar() {
  try { definirUsuarios(await api('GET', '/api/usuarios')); } catch (e) { /* mantém a lista padrão */ }
  if (estado.token) {
    try { await recarregar(); } catch (e) { estado.token = null; estado.sessao = null; salvar(); }
  }
  rotear(true);
})();
</script>
</body>
